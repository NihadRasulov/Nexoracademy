# 1. HTTP Server: Redirect all traffic to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # Health Check Endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }

    # API Proxy
    location /api/ {
        proxy_pass http://admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Static Assets under /admin/assets/
    location /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Redirect /admin (no trailing slash) to /admin/
    location = /admin {
        return 301 https://$host/admin/;
    }

    # Admin Panel SPA Routing
    # Maps /admin/ to /usr/share/nginx/html/ and falls back safely to index.html
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Dedicated fallback location for index.html when hit internally
    location = /index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reserved for Main Frontend Website (Root /)
    location / {
        default_type text/plain;
        return 404 "Main Website Frontend coming soon!";
    }
}
