# docker-compose.prod.yml — production orkestrasiyası.
#
# docker-compose.yml-dən fərqi:
#   - MailHog YOXDUR (real SMTP provayderi .env-də təyin olunmalıdır, bax
#     PRODUCTION_READINESS.md Bölmə 6).
#   - `app` servisi aktivdir və SPRING_PROFILES_ACTIVE=prod ilə işə düşür
#     (application-prod.yml-dəki placeholder-siz env dəyişənləri tələb olunur:
#     DB_*, JWT_SECRET, CORS_ALLOWED_ORIGINS — bax .env.example).
#   - Postgres portu host-a çıxarılmır (yalnız compose şəbəkəsi daxilində
#     `postgres` adı ilə əlçatandır) — verilənlər bazasını internetə açmamaq üçün.
#
# İşə salmaq:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Qeyd: `flyway` servisi burada da saxlanılıb ki, `app` başlamazdan əvvəl
# migration-lar tətbiq olunsun (`depends_on: condition: service_completed_successfully`).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME .env faylında təyin edilməlidir}
      POSTGRES_USER: ${DB_USER:?DB_USER .env faylında təyin edilməlidir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylında təyin edilməlidir}
    volumes:
      - nexora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    container_name: nexora-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 5
      FLYWAY_SCHEMAS: identity,catalog,academics,billing,outcomes,crm,cms,ai,notify,platform,analytics
      FLYWAY_DEFAULT_SCHEMA: identity
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_OUT_OF_ORDER: "false"
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    command: migrate

  app:
    build: .
    container_name: nexora-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Compose şəbəkəsinin daxilindən Postgres-ə servis adı ilə qoşulmaq
      # lazımdır — .env-dəki DB_HOST=localhost yalnız compose-suz işə salınanda doğrudur.
      DB_HOST: postgres
    ports:
      - "8081:8081"
    volumes:
      - nexora_app_logs:/app/logs
    depends_on:
      flyway:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexora_pg_data:
  nexora_app_logs:
