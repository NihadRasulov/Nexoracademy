# docker-compose.prod.yml — production orkestrasiyası (Docker ilə deploy).
#
# İşə salmaq:
#   docker compose -f docker-compose.prod.yml up -d --build
# Yoxlamaq:
#   docker compose -f docker-compose.prod.yml ps        # hamısı "healthy" olmalıdır
#   docker compose -f docker-compose.prod.yml logs -f app
#
# Servislər:
#   nginx    → TLS terminasiyası + tək ictimai giriş nöqtəsi (80/443)
#   app      → Spring Boot (8081 API, 9091 actuator) — host-a AÇILMIR
#   postgres → verilənlər bazası — host-a AÇILMIR
#   flyway   → migration-ları app-dan əvvəl tətbiq edir, sonra çıxır
#   backup   → gündəlik pg_dump
#
# docker-compose.yml (dev) ilə fərqi: MailHog yoxdur, prod profili aktivdir,
# heç bir daxili port host-a çıxarılmır, nginx əlavə olunub.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME .env faylında təyin edilməlidir}
      POSTGRES_USER: ${DB_USER:?DB_USER .env faylında təyin edilməlidir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylında təyin edilməlidir}
      # PVC/volume kökündəki "lost+found" üzündən initdb "directory not empty"
      # verməsin deyə data alt-qovluğa yazılır.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nexora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Docker default olaraq json-file log-larını SONSUZ böyüdür — aylar sonra
    # host diski dolur və bütün konteynerlər dayanır. Hər servisdə rotasiya var.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      resources:
        limits: { memory: 1G }

  flyway:
    image: flyway/flyway:10
    container_name: nexora-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 5
      FLYWAY_SCHEMAS: identity,catalog,academics,billing,outcomes,crm,cms,ai,notify,platform,analytics
      FLYWAY_DEFAULT_SCHEMA: identity
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_OUT_OF_ORDER: "false"
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    command: migrate
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build: .
    image: nexora-academy:latest
    container_name: nexora-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Compose şəbəkəsinin daxilində Postgres-ə servis adı ilə qoşulmaq lazımdır —
      # .env-dəki DB_HOST=localhost yalnız compose-suz işə salınanda doğrudur.
      DB_HOST: postgres
      DB_PORT: 5432
    # DİQQƏT: `ports:` QƏSDƏN YOXDUR. Tətbiq yalnız nginx vasitəsilə əlçatandır.
    # 8081-i host-a açsanız, TLS-siz və rate-limit-siz birbaşa giriş yaranır və
    # 9091 (actuator) da təsadüfən açıla bilər. Sazlama üçün müvəqqəti lazım olsa:
    #   ports: ["127.0.0.1:8081:8081"]   ← mütləq 127.0.0.1 ilə məhdudlaşdırın
    expose:
      - "8081"
      - "9091"
    volumes:
      - nexora_app_logs:/app/logs
    depends_on:
      flyway:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      resources:
        limits: { memory: 1G }

  nginx:
    image: nginx:1.27-alpine
    container_name: nexora-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # DEVOPS: TLS sertifikatları. certbot istifadə edilirsə adətən
      # /etc/letsencrypt host qovluğu bura bağlanır.
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Gündəlik pg_dump. Sadə "sleep döngəsi" ilə işləyir — host cron-una
  # ehtiyac qalmasın deyə (Windows/Linux fərqi olmadan eyni işləyir).
  backup:
    image: pgvector/pgvector:pg16
    container_name: nexora-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          STAMP="$$(date -u +%Y%m%dT%H%M%SZ)"
          if pg_dump -Fc -f "/backups/nexora-$${STAMP}.dump"; then
            echo "[backup] ok: nexora-$${STAMP}.dump"
          else
            echo "[backup] FAILED at $${STAMP}" >&2
          fi
          find /backups -name 'nexora-*.dump' -mtime +14 -delete
          sleep 86400
        done
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  nexora_pg_data:
  nexora_app_logs:
