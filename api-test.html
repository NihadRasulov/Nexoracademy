<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora API — Bağlantı Testi</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; padding: 24px;
         background: #f6f7f9; color: #16181d; }
  @media (prefers-color-scheme: dark) { body { background: #14161a; color: #e8eaed; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { opacity: .65; font-size: 13px; margin-bottom: 20px; }
  .panel { background: rgba(127,127,127,.08); border: 1px solid rgba(127,127,127,.25);
           border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; opacity: .7; margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px 10px; border-radius: 6px; font-size: 14px;
                  border: 1px solid rgba(127,127,127,.4); background: rgba(127,127,127,.06);
                  color: inherit; box-sizing: border-box; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .row > div { flex: 1 1 220px; }
  button { padding: 10px 20px; border-radius: 6px; border: 0; background: #2f6feb; color: #fff;
           font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .summary { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; margin-bottom: 12px; }
  .summary b { font-size: 20px; display: block; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 640px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid rgba(127,127,127,.2); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
  td.path { font-family: ui-monospace, Consolas, monospace; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .ok   { background: #d7f5dd; color: #10632a; }
  .warn { background: #fdeecf; color: #7a4c04; }
  .err  { background: #fbdcdc; color: #8c1d1d; }
  .muted { opacity: .55; }
  pre.note { white-space: pre-wrap; font-size: 12px; margin: 12px 0 0; opacity: .8; }
</style>
</head>
<body>

<h1>Nexora Academy — API Bağlantı Testi</h1>
<div class="sub">Bu səhifə brauzerdən bütün endpointləri sıra ilə çağırır: bağlantı, CORS, auth və datanın gəlib-gəlmədiyini göstərir.</div>

<div class="panel">
  <div class="row">
    <div style="flex: 2 1 320px;">
      <label>Backend ünvanı (API_BASE_URL)</label>
      <input id="baseUrl" value="http://__PUBLIC_HOST__:8081">
    </div>
    <div>
      <label>Hesab</label>
      <select id="account">
        <option value="system-admin@nexora.com|system-admin1234">SYSTEM_ADMIN (hər şeyi görür)</option>
        <option value="admin@nexora.com|admin1234">ADMIN</option>
        <option value="content-manager@nexora.com|content-manager1234">CONTENT_MANAGER</option>
        <option value="sales-crm@nexora.com|sales-crm1234">SALES_CRM</option>
        <option value="">Girişsiz (yalnız public endpointlər)</option>
      </select>
    </div>
  </div>
  <button id="run">Testi başlat</button>
</div>

<div class="panel" id="out" hidden>
  <div class="summary">
    <div><b id="cOk">0</b> uğurlu</div>
    <div><b id="cEmpty">0</b> boş data</div>
    <div><b id="cErr">0</b> xəta</div>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Endpoint</th><th>Status</th><th>Nəticə</th><th>ms</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <pre class="note" id="note"></pre>
</div>

<script>
// Bütün GET siyahı endpointləri. auth:false = token olmadan da işləməlidir.
const ENDPOINTS = [
  { path: '/actuator/health',                  auth: false },
  { path: '/api/v1/courses',                   auth: false },
  { path: '/api/v1/categories',                auth: false },
  { path: '/api/v1/users/me',                  auth: true  },
  { path: '/api/v1/instructors',               auth: true  },
  { path: '/api/v1/course-groups',             auth: true  },
  { path: '/api/v1/course-instructors',        auth: true  },
  { path: '/api/v1/enrollments',               auth: true  },
  { path: '/api/v1/course-reviews',            auth: true  },
  { path: '/api/v1/kb-articles',               auth: true  },
  { path: '/api/v1/graduate-outcomes',         auth: true  },
  { path: '/api/v1/content/cms-content',       auth: true  },
  { path: '/api/v1/users',                     auth: true  },
  { path: '/api/v1/payments',                  auth: true  },
  { path: '/api/v1/scholarships',              auth: true  },
  { path: '/api/v1/sales/leads',               auth: true  },
  { path: '/api/v1/sales/campaigns',           auth: true  },
  { path: '/api/v1/sales/contact-submissions', auth: true  },
  { path: '/api/v1/sales/chat-sessions',       auth: true  },
  { path: '/api/v1/notifications',             auth: true  },
  { path: '/api/v1/sessions',                  auth: true  },
  { path: '/api/v1/oauth-accounts',            auth: true  },
  { path: '/api/v1/admin/audit-logs',          auth: true  },
];

const $ = id => document.getElementById(id);
let counts = { ok: 0, empty: 0, err: 0 };

function addRow(path, statusHtml, result, ms, cls) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="path">${path}</td><td>${statusHtml}</td>
                  <td class="${cls === 'muted' ? 'muted' : ''}">${result}</td><td class="muted">${ms}</td>`;
  $('rows').appendChild(tr);
}

// Cavabdakı qeyd sayını tapır: Spring Page (totalElements) və ya adi array.
function describe(data) {
  if (data === null || data === undefined) return { text: 'cavab boşdur', empty: true };
  if (Array.isArray(data)) return { text: `${data.length} qeyd`, empty: data.length === 0 };
  if (typeof data.totalElements === 'number')
    return { text: `${data.totalElements} qeyd (səhifə: ${data.content?.length ?? 0})`, empty: data.totalElements === 0 };
  if (data.status) return { text: `status: ${data.status}`, empty: false };
  return { text: 'obyekt qayıtdı', empty: false };
}

async function login(base, email, password) {
  const res = await fetch(`${base}/api/v1/auth/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  if (!res.ok) throw new Error(`Login uğursuz oldu — HTTP ${res.status}. Şifrə/e-poçt yanlış ola bilər.`);
  const body = await res.json();
  // Admin rolları birbaşa token alır; STUDENT/GUEST əvəzinə OTP cavabı gəlir (accessToken olmur).
  if (!body.accessToken) throw new Error('Token gəlmədi — bu hesab OTP tələb edir. Admin hesabı seç.');
  return body.accessToken;
}

async function run() {
  const base = $('baseUrl').value.trim().replace(/\/+$/, '');
  const acc = $('account').value;
  $('run').disabled = true;
  $('out').hidden = false;
  $('rows').innerHTML = '';
  $('note').textContent = '';
  counts = { ok: 0, empty: 0, err: 0 };

  let token = null;
  if (acc) {
    const [email, password] = acc.split('|');
    try {
      token = await login(base, email, password);
      addRow('POST /api/v1/auth/login', '<span class="pill ok">200</span>', 'token alındı ✓', '—', '');
      counts.ok++;
    } catch (e) {
      const isNetwork = e instanceof TypeError;
      addRow('POST /api/v1/auth/login', '<span class="pill err">—</span>',
             isNetwork ? 'BAĞLANTI/CORS XƏTASI' : e.message, '—', '');
      counts.err++;
      $('note').textContent = isNetwork
        ? 'Backend-ə heç çatmadı. Səbəb: (1) ünvan/port yanlış, (2) eyni Wi-Fi-da deyilsiniz, '
        + '(3) Windows Firewall bloklayır, (4) CORS_ALLOWED_ORIGINS-də bu səhifənin origin-i yoxdur.\n'
        + 'Bu səhifənin origin-i: ' + location.origin + '\n'
        + 'Dəqiq səbəb üçün F12 → Console-a bax — CORS-dursa orada açıq yazılır.'
        : 'Login alınmadı, ona görə auth tələb edən endpointlər sınanmadı.';
      render();
      $('run').disabled = false;
      return;
    }
  }

  for (const ep of ENDPOINTS) {
    if (ep.auth && !token) {
      addRow('GET ' + ep.path, '<span class="pill warn">keçildi</span>', 'token yoxdur', '—', 'muted');
      continue;
    }
    const t0 = performance.now();
    try {
      const res = await fetch(base + ep.path, {
        headers: (ep.auth && token) ? { Authorization: 'Bearer ' + token } : {}
      });
      const ms = Math.round(performance.now() - t0);
      if (!res.ok) {
        const hint = res.status === 403 ? 'bu rolun icazəsi yoxdur' : res.status === 401 ? 'token etibarsız' : 'server xətası';
        addRow('GET ' + ep.path, `<span class="pill err">${res.status}</span>`, hint, ms, '');
        counts.err++;
        continue;
      }
      const d = describe(await res.json().catch(() => null));
      addRow('GET ' + ep.path,
             `<span class="pill ${d.empty ? 'warn' : 'ok'}">${res.status}</span>`,
             d.empty ? d.text + ' — bağlantı işləyir, DB boşdur' : d.text, ms, d.empty ? 'muted' : '');
      d.empty ? counts.empty++ : counts.ok++;
    } catch (e) {
      addRow('GET ' + ep.path, '<span class="pill err">—</span>', 'BAĞLANTI/CORS XƏTASI', '—', '');
      counts.err++;
    }
    render();
  }

  if (!$('note').textContent) {
    $('note').textContent = counts.err === 0
      ? 'Bütün endpointlər cavab verdi — frontend backend ilə tam işləyir. '
      + 'Sarı sətirlər xəta deyil: bağlantı qurulub, sadəcə həmin cədvəldə hələ data yoxdur.'
      : counts.err + ' endpointdə problem var. 403 = rol icazəsi məsələsidir (normal). '
      + '"BAĞLANTI/CORS XƏTASI" = şəbəkə və ya CORS problemi, F12 → Console-a bax.';
  }
  render();
  $('run').disabled = false;
}

function render() {
  $('cOk').textContent = counts.ok;
  $('cEmpty').textContent = counts.empty;
  $('cErr').textContent = counts.err;
}

$('run').addEventListener('click', run);
</script>

</body>
</html>
