services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexora_academy}
      POSTGRES_USER: ${DB_USER:-nexora_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylında təyin edilməlidir}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nexora_pg_data:/var/lib/postgresql/data
    networks:
      - nexora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexora_app} -d ${DB_NAME:-nexora_academy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 500M

  flyway:
    image: flyway/flyway:10
    container_name: nexora-flyway
    networks:
      - nexora-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nexora_academy}
      FLYWAY_USER: ${DB_USER:-nexora_app}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylında təyin edilməlidir}
      FLYWAY_CONNECT_RETRIES: 5
      FLYWAY_SCHEMAS: identity,catalog,academics,billing,outcomes,crm,cms,ai,notify,platform,analytics
      FLYWAY_DEFAULT_SCHEMA: identity
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_OUT_OF_ORDER: "false"
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    command: migrate

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nexora-mailhog
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "8025:8025"
    networks:
      - nexora-net

  chatbot-api:
    build:
      context: ./chatbot-api
      dockerfile: Dockerfile
    container_name: nexora-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nexora_academy}
      - DB_USER=${DB_USER:-nexora_app}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - nexora-net
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 300M

  app:
    build: .
    container_name: nexora-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      MAIL_HOST: mailhog
      JAVA_OPTS: "-Xmx256m -Xms128m"
    ports:
      - "8081:8081"
    networks:
      - nexora-net
    volumes:
      - nexora_app_logs:/app/logs
    depends_on:
      flyway:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 400M

  admin-bff:
    build:
      context: ./adminpanel/NexoraAdminPanel/src/NexoraAcademy.AdminBff
      dockerfile: Dockerfile
    container_name: nexora-admin-bff
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      NexoraApi__BaseUrl: http://app:8081
      Cors__AllowedOrigins__0: https://${PUBLIC_HOST}
      Cookie__RequireHttps: ${ADMIN_BFF_COOKIE_REQUIRE_HTTPS:-false}
    ports:
      - "${ADMIN_BFF_PORT:-8090}:8080"
    networks:
      - nexora-net
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 250M
  admin-ui:
    build:
      context: ./adminpanelUI
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "https://${PUBLIC_HOST}"
        VITE_DEMO_MODE: "false"
    container_name: nexora-admin-ui
    restart: unless-stopped
    ports:
      - "443:443"
    networks:
      - nexora-net
    depends_on:
      - admin-bff
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:443/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  nexora-net:
    driver: bridge

volumes:
  nexora_pg_data:
  nexora_app_logs:
