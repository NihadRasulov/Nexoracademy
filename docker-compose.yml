services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-nexora_academy}
      POSTGRES_USER: ${DB_USER:-nexora_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - nexora_pg_data:/var/lib/postgresql/data
    networks: [nexora-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexora_app} -d ${DB_NAME:-nexora_academy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    env_file: .env
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nexora_academy}
      FLYWAY_USER: ${DB_USER:-nexora_app}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      FLYWAY_CONNECT_RETRIES: 5
      FLYWAY_SCHEMAS: identity,catalog,crm,cms,platform
      FLYWAY_DEFAULT_SCHEMA: identity
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
    volumes:
      - ./backend/api/src/main/resources/db/migration:/flyway/sql:ro
    command: migrate
    networks: [nexora-net]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nexora-redis-pass}
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexora-redis-pass} --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks: [nexora-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend/api
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      # Explicit Spring mappings make the container contract unambiguous and
      # prevent a silent fallback to an unconfigured DataSource.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nexora_academy}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-nexora_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      UPLOADS_DIR: /app/uploads
      JAVA_OPTS: -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Xms256m -Xmx512m
      # Migrations are handled by the separate flyway service.
      SPRING_FLYWAY_ENABLED: "false"
      # Increase Tomcat multipart upload limit (default 1MB) to match nginx's 30 MB.
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 30MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 30MB
      # DotenvEnvironmentPostProcessor reads .env in CWD, but Docker has none.
      # Map flat env-var names to Spring Boot relaxed-binding format (app.admin-seed.*).
      APP_ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      APP_ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      APP_ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      APP_JWT_SECRET: ${JWT_SECRET:-}
      APP_JWT_ISSUER: ${JWT_ISSUER:-}
      APP_JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-}
      APP_JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    expose: ["8081"]
    volumes:
      - nexora_app_logs:/app/logs
      - nexora_uploads:/app/uploads
    networks: [nexora-net]
    depends_on:
      flyway:
        condition: service_completed_successfully

  chatbot-api:
    build: ./backend/chatbot-api
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nexora_academy}
      DB_USER: ${DB_USER:-nexora_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexora-redis-pass}@redis:6379/0
    expose: ["8000"]
    volumes:
      - nexora_chroma_data:/app/chroma_db
    networks: [nexora-net]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  admin-bff:
    build:
      context: .
      dockerfile: backend/admin-bff/NexoraAdminPanel/NexoraAdminPanel/src/NexoraAcademy.AdminBff/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      NexoraApi__BaseUrl: http://app:8081
      ReverseProxy__KnownProxies__0: ${NEXORA_GATEWAY_IP:-172.30.0.2}
    expose: ["8080"]
    networks: [nexora-net]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/sys-control-9912/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  main-ui:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend/main-site:/usr/share/nginx/html:ro
    networks: [nexora-net]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3

  web-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nexora_tls_data:/etc/nginx/certs:ro
      - nexora_acme_challenges:/var/www/certbot:ro
      - ./frontend/main-site/static:/etc/nginx/static:ro
    networks:
      nexora-net:
        ipv4_address: ${NEXORA_GATEWAY_IP:-172.30.0.10}
    depends_on:
      main-ui:
        condition: service_healthy
      app:
        condition: service_healthy
      chatbot-api:
        condition: service_healthy
      admin-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --no-check-certificate --user-agent=NexoraHealth https://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # One-shot TLS helper. It is excluded from normal `docker compose up` by its
  # profile and is invoked only through deploy.sh tls/renew-tls.
  certbot:
    image: certbot/certbot:latest
    profiles: [tls]
    ports:
      - "80:80"
    volumes:
      - nexora_tls_data:/etc/letsencrypt
      - nexora_acme_challenges:/var/www/certbot

networks:
  nexora-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NEXORA_SUBNET:-172.30.0.0/24}

volumes:
  nexora_pg_data:
  nexora_app_logs:
  nexora_uploads:
  nexora_chroma_data:
  nexora_tls_data:
  nexora_acme_challenges:
