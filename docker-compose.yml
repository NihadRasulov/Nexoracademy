services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexora-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-nexora_academy}
      POSTGRES_USER: ${DB_USER:-nexora_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylında təyin edilməlidir}
    # PostgreSQL Performance Tuning Parameters
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c max_worker_processes=4
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - nexora_pg_data:/var/lib/postgresql/data
    networks:
      - nexora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexora_app} -d ${DB_NAME:-nexora_academy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M

  flyway:
    image: flyway/flyway:10
    container_name: nexora-flyway
    env_file: .env
    networks:
      - nexora-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nexora_academy}
      FLYWAY_USER: ${DB_USER:-nexora_app}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylında təyin edilməlidir}
      FLYWAY_CONNECT_RETRIES: 5
      FLYWAY_SCHEMAS: identity,catalog,academics,billing,outcomes,crm,cms,ai,notify,platform,analytics
      FLYWAY_DEFAULT_SCHEMA: identity
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_OUT_OF_ORDER: "false"
    volumes:
      - ./backend/api/src/main/resources/db/migration:/flyway/sql
    command: migrate

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nexora-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - nexora-net

  chatbot-api:
    build:
      context: ./backend/chatbot-api
      dockerfile: Dockerfile
    container_name: nexora-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nexora_academy}
      - DB_USER=${DB_USER:-nexora_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://:nexora-redis-pass@nexora-redis:6379/0
      - REDIS_ENABLED=true
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${DB_USER:-nexora_app}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-nexora_academy}
    networks:
      - nexora-net
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 400M

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    # Lowered maxmemory to fit container limit safely (128mb -> 256mb limit)
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexora-redis-pass} --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - nexora-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build: ./backend/api
    container_name: nexora-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      # Optimized JVM GC & Memory Flags for Spring Boot
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -Xms256m -Xmx512m"
    ports:
      - "8081:8081"
    networks:
      - nexora-net
    volumes:
      - nexora_app_logs:/app/logs
    depends_on:
      flyway:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 800M

  admin-bff:
    build:
      context: .
      dockerfile: backend/admin-bff/NexoraAdminPanel/NexoraAdminPanel/src/NexoraAcademy.AdminBff/Dockerfile
    container_name: nexora-admin-bff
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      NexoraApi__BaseUrl: http://app:8081
      Cors__AllowedOrigins__0: https://${PUBLIC_HOST}
      Cookie__RequireHttps: "true"
    ports:
      - "${ADMIN_BFF_PORT:-8090}:8080"
    networks:
      - nexora-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/sys-control-9912/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 400M

  # --- SEPARATED MAIN FRONTEND ---
  main-ui:
    build:
      context: ./frontend/main-site
      dockerfile: Dockerfile
    container_name: nexora-main-ui
    restart: unless-stopped
    env_file: .env
    networks:
      - nexora-net
    volumes:
      - "./frontend/main-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./frontend/main-site/assets:/usr/share/nginx/html/assets:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # --- SEPARATED ADMIN UI ---
  admin-ui:
    build:
      context: ./frontend/admin-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "https://${PUBLIC_HOST}"
        VITE_DEMO_MODE: "false"
    container_name: nexora-admin-ui
    restart: unless-stopped
    networks:
      - nexora-net
    depends_on:
      - admin-bff
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # --- REVERSE PROXY / GATEWAY ---
  web-gateway:
    image: nginx:alpine
    container_name: nexora-web-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "/etc/letsencrypt:/etc/nginx/certs:ro"
    networks:
      - nexora-net
    depends_on:
      - main-ui
      - admin-ui
      - admin-bff
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --no-check-certificate http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  nexora-net:
    driver: bridge

volumes:
  nexora_pg_data:
  nexora_app_logs:
