services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexora_academy}
      POSTGRES_USER: ${DB_USER:-nexora_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylında təyin edilməlidir}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nexora_pg_data:/var/lib/postgresql/data
    networks:
      - nexora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexora_app} -d ${DB_NAME:-nexora_academy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 500M

  flyway:
    image: flyway/flyway:10
    container_name: nexora-flyway
    networks:
      - nexora-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nexora_academy}
      FLYWAY_USER: ${DB_USER:-nexora_app}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylında təyin edilməlidir}
      FLYWAY_CONNECT_RETRIES: 5
      FLYWAY_SCHEMAS: identity,catalog,academics,billing,outcomes,crm,cms,ai,notify,platform,analytics
      FLYWAY_DEFAULT_SCHEMA: identity
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_OUT_OF_ORDER: "false"
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    command: migrate

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nexora-mailhog
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "8025:8025"
    networks:
      - nexora-net

  chatbot-api:
    build:
      context: ./chatbot-api
      dockerfile: Dockerfile
    container_name: nexora-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nexora_academy}
      - DB_USER=${DB_USER:-nexora_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://nexora-redis:6379/0
      - REDIS_ENABLED=true
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${DB_USER:-nexora_app}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-nexora_academy}
    networks:
      - nexora-net
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - nexora-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 150M

  app:
    build: .
    container_name: nexora-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      JAVA_OPTS: "-Xmx256m -Xms128m"
    ports:
      - "8081:8081"
    networks:
      - nexora-net
    volumes:
      - nexora_app_logs:/app/logs
    depends_on:
      flyway:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 400M

  #admin-bff:
   # build:
    #  context: ./adminpanel/NexoraAdminPanel/src/NexoraAcademy.AdminBff
     # dockerfile: Dockerfile
    #container_name: nexora-admin-bff
    #restart: unless-stopped
    #environment:
    #  ASPNETCORE_ENVIRONMENT: Production
    #  NexoraApi__BaseUrl: http://app:8081
    #  Cors__AllowedOrigins__0: https://${PUBLIC_HOST}
    #  Cookie__RequireHttps: ${ADMIN_BFF_COOKIE_REQUIRE_HTTPS:-true}
    #ports:
    #  - "${ADMIN_BFF_PORT:-8090}:8080"
    #networks:
    #  - nexora-net
    #depends_on:
    #  - app
    #deploy:
    #  resources:
    #    limits:
    #      memory: 250M
  admin-bff:
    build:
      context: ./adminpanel/NexoraAdminPanel/src/NexoraAcademy.AdminBff
      dockerfile: Dockerfile
    container_name: nexora-admin-bff
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      NexoraApi__BaseUrl: http://app:8081
      Cors__AllowedOrigins__0: https://${PUBLIC_HOST}
      Cookie__RequireHttps: "true"
    ports:
      - "${ADMIN_BFF_PORT:-8090}:8080"
    networks:
      - nexora-net
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 250M


  # --- SEPARATED MAIN FRONTEND ---
  main-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-main-ui
    restart: unless-stopped
    env_file: .env
    networks:
      - nexora-net
    volumes:
      - "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    deploy:
      resources:
        limits:
          memory: 150M

  # --- SEPARATED ADMIN UI ---
  admin-ui:
    build:
      context: ./adminpanelUI
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "https://${PUBLIC_HOST}"
        VITE_DEMO_MODE: "false"
    container_name: nexora-admin-ui
    restart: unless-stopped
    networks:
      - nexora-net
    depends_on:
      - admin-bff
    deploy:
      resources:
        limits:
          memory: 150M

  # --- REVERSE PROXY / GATEWAY ---
  web-gateway:
    image: nginx:alpine
    container_name: nexora-web-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./certs:/etc/nginx/certs:ro"
    networks:
      - nexora-net
    depends_on:
      - main-ui
      - admin-ui
      - admin-bff
    deploy:
      resources:
        limits:
          memory: 100M

networks:
  nexora-net:
    driver: bridge

volumes:
  nexora_pg_data:
  nexora_app_logs:
