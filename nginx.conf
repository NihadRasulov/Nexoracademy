# Nexora Academy public gateway

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/json
    application/javascript application/xml image/svg+xml font/woff2;

proxy_hide_header X-Powered-By;
limit_req_zone $binary_remote_addr zone=public_api:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;

map $http_user_agent $bad_bot {
    default 0;
    ~*(sqlmap|nikto|dirbuster|masscan|nmap|zgrab|gobuster|ffuf) 1;
    ~*(scrapy|ahrefsbot|semrushbot|mj12bot|dotbot|petalbot|bytespider) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexoracademy.az www.nexoracademy.az;

    # Certbot renewal uses the shared webroot without taking the gateway down.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 301 https://nexoracademy.az$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nexoracademy.az www.nexoracademy.az;

    if ($host = www.nexoracademy.az) {
        return 301 https://nexoracademy.az$request_uri;
    }

    if ($bad_bot) { return 403; }

    ssl_certificate /etc/nginx/certs/live/nexoracademy.az/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/nexoracademy.az/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 30m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;
    limit_conn connections 20;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /robots.txt {
        alias /etc/nginx/static/robots.txt;
        access_log off;
    }

    location = /sitemap.xml {
        alias /etc/nginx/static/sitemap.xml;
        default_type application/xml;
        access_log off;
    }

    # Public website API: browser -> Java -> PostgreSQL.
    location ^~ /api/v1/public/ {
        limit_req zone=public_api burst=50 nodelay;
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Publicly viewable images/videos. CV files are never exposed here.
    location ^~ /uploads/ {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public chatbot: browser -> Python. No standalone chatbot page is exposed.
    location = /api/chat {
        limit_req zone=chat_api burst=10 nodelay;
        proxy_pass http://chatbot-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Admin UI and all admin API traffic live behind one non-public route.
    # The C# BFF removes this prefix before forwarding API requests to Java,
    # keeps Java tokens server-side, and gives the browser an HttpOnly cookie.
    location ^~ /sys-control-9912/ {
        limit_req zone=public_api burst=50 nodelay;
        proxy_pass http://admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Never expose Java admin/auth endpoints without the C# BFF.
    location ^~ /api/v1/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location ^~ /swagger-ui/ { return 404; }
    location ^~ /v3/api-docs { return 404; }
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /administrator { return 404; }
    location ^~ /administrator/ { return 404; }

    location / {
        proxy_pass http://main-ui:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
