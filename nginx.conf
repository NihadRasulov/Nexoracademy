# --- Gzip Compression ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml application/rss+xml
    application/vnd.ms-fontobject application/x-font-ttf font/opentype
    image/svg+xml image/x-icon;

# --- Security Headers ---
proxy_hide_header X-Powered-By;

# --- Rate Limiting Zones ---
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=300r/m;

# --- HTTP Server (Port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name nexoracademy.az www.nexoracademy.az;

    # Health check endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Server (Port 443 with HTTP/2 Support) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexoracademy.az www.nexoracademy.az;

    # SSL Certificates
    ssl_certificate     /etc/nginx/certs/live/nexoracademy.az/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/nexoracademy.az/privkey.pem;

    # SSL Optimization & Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # General Settings & Security Headers
    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gateway Healthcheck
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }

    # ── Auth Endpoints (Rate Limited) ──
    location /api/v1/auth {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Admin Panel BFF ──
    location /api/admin {
        proxy_pass http://nexora-admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location /api/auth {
        proxy_pass http://nexora-admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location /api/health {
        proxy_pass http://nexora-admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── AI Chatbot API ──
    location /api/chat {
        proxy_pass http://nexora-chatbot:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /api/lead {
        proxy_pass http://nexora-chatbot:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Swagger UI & OpenAPI Docs ──
    location /swagger-ui {
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location /v3/api-docs {
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Static Assets ──
    location /assets/ {
        proxy_pass http://nexora-main-ui:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Spring Boot Actuator ──
    location /actuator/ {
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Main Platform Backend API ──
    location /api {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Admin Panel Static UI ──
    location /admin/ {
        proxy_pass http://nexora-admin-ui:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /admin {
        return 301 https://$host/admin/;
    }

    # ── Chatbot Frontend UI ──
    location /chat/ {
        proxy_pass http://nexora-chatbot:8000/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /chat {
        return 301 https://$host/chat/;
    }

    # ── Main Website SPA (Catch-all) ──
    location / {
        proxy_pass http://nexora-main-ui:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
