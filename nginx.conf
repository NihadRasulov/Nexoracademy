# --- HTTP Server (Redirects all HTTP to HTTPS) ---
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- HTTPS Server ---
server {
    listen 443 ssl;
    server_name _;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Recommended SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }

    # 1. Admin Panel BFF Auth API (Routes /api/auth/ to nexora-admin-bff)
    location ^~  /api/auth/ {
        proxy_pass http://nexora-admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 1b. Admin Panel BFF Health API (Routes /api/health/ to nexora-admin-bff)
    location ^~ /api/health/ {
        proxy_pass http://nexora-admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    # 2. Main Platform Backend API (nexora-app on 8081 - NO trailing slash!)
    location /api/ {
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Redirect /admin to /admin/
    location = /admin {
        return 301 https://$host/admin/;
    }

    # 3. Admin Panel Static UI
    location /admin/ {
        proxy_pass http://nexora-admin-ui:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Main UI SPA
    location / {
        proxy_pass http://nexora-main-ui:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
