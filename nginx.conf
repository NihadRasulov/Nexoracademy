# ──────────────────────────────────────────────────────────────
# NexoraAcademy — Nginx Reverse Proxy
# ──────────────────────────────────────────────────────────────
# Sits in front of all internal services:
#   nexora-app:8081         Spring Boot (main API)
#   nexora-admin-bff:8080   ASP.NET Core BFF (admin panel auth)
#   nexora-chatbot:8000     Python FastAPI (AI chatbot)
#   nexora-admin-ui:80      Admin panel SPA
#   nexora-main-ui:80       Main website SPA
# ──────────────────────────────────────────────────────────────

# --- Gzip Compression ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml application/rss+xml
    application/vnd.ms-fontobject application/x-font-ttf font/opentype
    image/svg+xml image/x-icon;

# --- Security Headers ---
proxy_hide_header X-Powered-By;

# --- Rate Limiting ---
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=300r/m;

# --- HTTP Server (redirect all HTTP to HTTPS) ---
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- HTTPS Server ---
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- HSTS (2 years + includeSubDomains + preload) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- CSP (XSS protection) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none';" always;

    # --- Permissions Policy ---
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # --- XSS Protection (legacy browsers) ---
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Cross-Origin Policies ---
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Nginx own health check (for load balancer / orchestration)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }

    # ── Auth endpoints (rate limited) ──
    location ^~ /api/v1/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Admin Panel BFF (all admin endpoints) ──
    location ^~ /api/admin/ {
        proxy_pass http://nexora-admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Admin Panel BFF Auth ──
    location ^~ /api/auth/ {
        proxy_pass http://nexora-admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Admin Panel BFF Health ──
    location ^~ /api/health/ {
        proxy_pass http://nexora-admin-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── AI Chatbot API (Python FastAPI, port 8000) ──
    location ^~ /api/chat {
        proxy_pass http://nexora-chatbot:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location ^~ /api/lead {
        proxy_pass http://nexora-chatbot:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Swagger UI / OpenAPI docs (Spring Boot, port 8081) ──
    location ^~ /swagger-ui/ {
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /v3/api-docs {
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Spring Boot Actuator ──
    location ^~ /actuator/ {
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Main Platform Backend API (Spring Boot, port 8081) ──
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://nexora-app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ── Admin Panel Static UI ──
    location /admin/ {
        proxy_pass http://nexora-admin-ui:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Redirect /admin to /admin/
    location = /admin {
        return 301 https://$host/admin/;
    }

    # ── Chatbot Frontend UI ──
    location /chat {
        proxy_pass http://nexora-chatbot:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Redirect /chat to /chat/
    location = /chat {
        return 301 https://$host/chat/;
    }

    # ── Main Website SPA (catch-all) ──
    location / {
        proxy_pass http://nexora-main-ui:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
