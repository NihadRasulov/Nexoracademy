# CI — hər push/PR-da build + bütün testlər + image build.
# Testlər Testcontainers istifadə edir (bax src/test/.../TestcontainersConfiguration.java),
# ona görə ayrıca "services: postgres" bloku LAZIM DEYİL — GitHub-un ubuntu runner-ində
# Docker onsuz da var və konteyner test zamanı avtomatik qalxır.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build + run all tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Yalnız build — push YOXDUR. Registry seçiləndən sonra DevOps burada
      # docker/login-action + push əlavə etməlidir (bax PRODUCTION_HANDOVER.md).
      - name: Build image
        run: docker build -t nexora-academy:${{ github.sha }} .

      # Image-dəki məlum CVE-ləri göstərir. İlk mərhələdə build-i sındırmır
      # (exit-code: 0) — komanda nəticələri görüb baseline qurandan sonra
      # exit-code: 1 edin ki, kritik CVE-lər deploy-u dayandırsın.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nexora-academy:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '0'
