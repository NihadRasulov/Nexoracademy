# ──────────────────────────────────────────────────────────────
# NexoraAcademy — Secrets (şablon)
# ──────────────────────────────────────────────────────────────
# Bu faylı köçürün, base64 dəyərləri doldurun, sonra apply edin:
#
#   $ cp 02-secret-template.yaml 02-secret.yaml
#   $ # 02-secret.yaml-ı doldurun
#   $ kubectl apply -f 02-secret.yaml
#
# Kodlaşdırma: echo -n "myvalue" | base64      (mütləq -n — sondakı \n dəyərə düşür!)
#
# ⚠️  DOLDURULMUŞ 02-secret.yaml HEÇ VAXT git-ə COMMIT EDİLMƏMƏLİDİR.
#     Repo kökündəki .gitignore-a əlavə edin: k8s/02-secret.yaml
#     Daha yaxşı yol: Secret-ləri ümumiyyətlə YAML-da saxlamayın —
#     Sealed Secrets / External Secrets Operator / Vault istifadə edin.
#     (k8s Secret-ləri etcd-də yalnız base64-dür — şifrələnmiş DEYİL.)
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: nexora-secrets
  namespace: nexora-academy
type: Opaque
data:
  # Postgres şifrəsi (StatefulSet də eyni dəyəri oxuyur)
  #   echo -n "your-strong-db-password" | base64
  DB_PASSWORD: ""

  # JWT imzalama açarı — minimum 32 bayt (256 bit).
  #   openssl rand -base64 48 | tr -d '\n' | base64
  # Rotasiya edilərsə BÜTÜN mövcud access/refresh token-lər etibarsız olur
  # (istifadəçilər yenidən login etməlidir) — planlı vaxtda edin.
  JWT_SECRET: ""

  # SMTP
  #   echo -n "your-smtp-username" | base64
  MAIL_USERNAME: ""
  #   echo -n "your-smtp-password" | base64
  MAIL_PASSWORD: ""

  # Ödəniş gateway-i webhook secret-i.
  # BOŞ QALDIĞI MÜDDƏTCƏ /api/v1/payments/callback İMZA YOXLANMADAN qəbul edilir —
  # yəni istənilən kəs saxta "ödəniş uğurlu" callback-i göndərə bilər.
  # Gateway seçilən kimi mütləq doldurun (bax PRODUCTION_HANDOVER.md).
  PAYMENT_GATEWAY_WEBHOOK_SECRET: ""

  # ── Admin seed şifrələri ──────────────────────────────────────────────
  # YALNIZ ConfigMap-də ADMIN_SEED_ENABLED="true" olduqda oxunur.
  # Seed açıqdırsa və bu dəyərlərdən biri boşdursa, tətbiq AÇILIŞDA ÇÖKÜR
  # (AdminSeeder → IllegalStateException) — bu qəsdəndir, zəif/boş şifrə ilə
  # admin hesabı yaranmasın deyə. Hər biri üçün: openssl rand -base64 18
  ADMIN_SEED_SYSTEM_ADMIN_PASSWORD: ""
  ADMIN_SEED_ADMIN_PASSWORD: ""
  ADMIN_SEED_SALES_CRM_PASSWORD: ""
  ADMIN_SEED_CONTENT_MANAGER_PASSWORD: ""

  # ── Chat-bot ──────────────────────────────────────────────────────────
  # YALNIZ ConfigMap-də CHATBOT_ENABLED="true" olduqda lazımdır.
  CHATBOT_API_KEY: ""
