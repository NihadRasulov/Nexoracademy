# nginx.conf — NexoraAcademy prod reverse proxy
#
# DEVOPS-un dəyişməli olduğu YEGANƏ yer: aşağıdakı "api.example.com" (3 yerdə)
# və sertifikat fayllarının adları.
#
# Sertifikatlar ./deploy/certs qovluğuna qoyulur (konteynerdə /etc/nginx/certs).
# Let's Encrypt/certbot ilə:
#   certbot certonly --standalone -d api.<domen>
#   sonra fullchain.pem və privkey.pem-i ./deploy/certs-ə köçürün (və ya symlink).

# Rate limit zonası — tətbiqdəki limiter yaddaşdadır və yalnız bir instans üçün
# etibarlıdır (bax PRODUCTION_HANDOVER.md). Bu, ondan ƏVVƏL işləyən əlavə qatdır.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=600r/m;

# HTTP → HTTPS yönləndirmə. ACME (certbot) yoxlaması üçün .well-known açıq qalır.
server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Brauzer bu domenə bir daha http:// ilə getməsin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Yüklənən fayl ölçüsü (Cloudinary-yə göndərilən şəkillər).
    client_max_body_size 10m;

    # Tətbiq X-Forwarded-* başlıqlarına güvənir
    # (application-prod.yml → server.forward-headers-strategy: framework).
    # Bunlar olmadan Spring bağlantını http://<konteyner-ip>:8081 kimi görür və
    # generasiya olunan mütləq URL-lər http:// olur.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 30s;

    # Brute-force qorunması: login/register/OTP endpoint-ləri üçün daha sərt limit.
    location ~ ^/api/v1/auth/(login|register|forgot-password|resend-verification) {
        limit_req zone=auth_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8081;
    }

    location /api/ {
        limit_req zone=api_zone burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8081;
    }

    # DİQQƏT: /actuator QƏSDƏN proxy edilmir.
    # Actuator yalnız daxili 9091 portundadır və oraya yalnız compose şəbəkəsindən
    # (healthcheck, monitorinq) çıxış var. İctimai domendə açılsaydı, exposure
    # siyahısı bir dəfə genişlənən kimi /actuator/env bütün sirləri verərdi.

    # Qalan hər şey 404 — tətbiqin başqa ictimai səthi yoxdur.
    location / {
        return 404;
    }
}
