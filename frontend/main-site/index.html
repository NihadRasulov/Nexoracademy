  <!-- Roadmap dual-track runtime: begin -->
<script>
    (function () {
      var ROADMAP_DURATION = 7000;
      var animationFrame = 0;
      var animationStartedAt = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function setPath(path, d) {
        if (path) path.setAttribute('d', d);
      }

      function updateRoadmapDualTrackGeometry() {
        document.querySelectorAll('.RoadMapSection_roadmap__timeline__wrapper__EVRm5').forEach(function (wrapper) {
          var svg = wrapper.querySelector('.RoadMapSection_dual-track__line');
          if (!svg) return;

          var computed = window.getComputedStyle(wrapper);
          var gap = parseFloat(computed.getPropertyValue('--roadmap-track-gap')) || 280;
          var verticalInset = parseFloat(computed.getPropertyValue('--roadmap-track-inset')) || 60;
          var svgHeight = gap + verticalInset * 2;
          var centerY = svgHeight / 2;
          var upperY = centerY - gap / 2;
          var lowerY = centerY + gap / 2;

          svg.style.height = svgHeight + 'px';
          svg.setAttribute('viewBox', '0 0 1000 ' + svgHeight);

          var wrapperRect = wrapper.getBoundingClientRect();
          var currentDot = wrapper.querySelector('.RoadMapSection_roadmap__timeline__item--current .RoadMapSection_dot_wrapper__current');
          var currentRect = currentDot ? currentDot.getBoundingClientRect() : null;

          // Merge exactly through the center of the static white "Cari vÃ‰â„¢ziyyÃ‰â„¢t" point.
          var mergeX = 870;
          if (currentRect && wrapperRect.width) {
            mergeX = ((currentRect.left + currentRect.width / 2 - wrapperRect.left) / wrapperRect.width) * 1000;
          }
          mergeX = clamp(mergeX, 780, 920);

          var splitX = 192;
          var parallelStartX = 220;
          var mergeStartX = mergeX - 55;
          var splitControlX = splitX + 28;
          var mergeControlX = mergeX - 28;

          var entryD = 'M 0 ' + centerY + ' L ' + splitX + ' ' + centerY;
          var upperD = 'M ' + splitX + ' ' + centerY +
            ' C ' + splitControlX + ' ' + centerY + ' ' + splitControlX + ' ' + upperY + ' ' + parallelStartX + ' ' + upperY +
            ' L ' + mergeStartX + ' ' + upperY +
            ' C ' + mergeControlX + ' ' + upperY + ' ' + mergeControlX + ' ' + centerY + ' ' + mergeX + ' ' + centerY;
          var lowerD = 'M ' + splitX + ' ' + centerY +
            ' C ' + splitControlX + ' ' + centerY + ' ' + splitControlX + ' ' + lowerY + ' ' + parallelStartX + ' ' + lowerY +
            ' L ' + mergeStartX + ' ' + lowerY +
            ' C ' + mergeControlX + ' ' + lowerY + ' ' + mergeControlX + ' ' + centerY + ' ' + mergeX + ' ' + centerY;
          var exitD = 'M ' + mergeX + ' ' + centerY + ' L 1000 ' + centerY;
          var upperMotionD = 'M 25 ' + centerY + ' L ' + splitX + ' ' + centerY +
            ' C ' + splitControlX + ' ' + centerY + ' ' + splitControlX + ' ' + upperY + ' ' + parallelStartX + ' ' + upperY +
            ' L ' + mergeStartX + ' ' + upperY +
            ' C ' + mergeControlX + ' ' + upperY + ' ' + mergeControlX + ' ' + centerY + ' ' + mergeX + ' ' + centerY +
            ' L 975 ' + centerY;
          var lowerMotionD = 'M 25 ' + centerY + ' L ' + splitX + ' ' + centerY +
            ' C ' + splitControlX + ' ' + centerY + ' ' + splitControlX + ' ' + lowerY + ' ' + parallelStartX + ' ' + lowerY +
            ' L ' + mergeStartX + ' ' + lowerY +
            ' C ' + mergeControlX + ' ' + lowerY + ' ' + mergeControlX + ' ' + centerY + ' ' + mergeX + ' ' + centerY +
            ' L 975 ' + centerY;

          setPath(svg.querySelector('.RoadMapSection_dual-track__stroke--entry'), entryD);
          setPath(svg.querySelector('.RoadMapSection_dual-track__stroke--upper'), upperD);
          setPath(svg.querySelector('.RoadMapSection_dual-track__stroke--lower'), lowerD);
          setPath(svg.querySelector('.RoadMapSection_dual-track__stroke--exit'), exitD);
          setPath(svg.querySelector('.RoadMapSection_dual-track__motion--upper'), upperMotionD);
          setPath(svg.querySelector('.RoadMapSection_dual-track__motion--lower'), lowerMotionD);
        });
      }

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function placeMovingLight(wrapper, path, light, progress) {
        if (!path || !light || !path.getTotalLength) return;
        var length = path.getTotalLength();
        if (!length) return;
        var point = path.getPointAtLength(length * progress);
        var svg = wrapper.querySelector('.RoadMapSection_dual-track__line');
        if (!svg) return;
        var wrapperRect = wrapper.getBoundingClientRect();
        var svgRect = svg.getBoundingClientRect();
        var viewBox = svg.viewBox.baseVal;
        var x = (svgRect.left - wrapperRect.left) + ((point.x - viewBox.x) / viewBox.width) * svgRect.width;
        var y = (svgRect.top - wrapperRect.top) + ((point.y - viewBox.y) / viewBox.height) * svgRect.height;
        light.style.left = x + 'px';
        light.style.top = y + 'px';
      }

      function animateRoadmapLights(now) {
        if (!animationStartedAt) animationStartedAt = now;
        var raw = ((now - animationStartedAt) % ROADMAP_DURATION) / ROADMAP_DURATION;
        var progress = easeInOut(raw);
        var opacity = raw < 0.08 ? raw / 0.08 : (raw > 0.94 ? (1 - raw) / 0.06 : 1);
        opacity = clamp(opacity, 0, 1);

        document.querySelectorAll('.RoadMapSection_roadmap__timeline__wrapper__EVRm5').forEach(function (wrapper) {
          var upperPath = wrapper.querySelector('.RoadMapSection_dual-track__motion--upper');
          var lowerPath = wrapper.querySelector('.RoadMapSection_dual-track__motion--lower');
          var upperLight = wrapper.querySelector('.RoadMapSection_dual-track__moving-light--upper');
          var lowerLight = wrapper.querySelector('.RoadMapSection_dual-track__moving-light--lower');
          placeMovingLight(wrapper, upperPath, upperLight, progress);
          placeMovingLight(wrapper, lowerPath, lowerLight, progress);
          if (upperLight) upperLight.style.opacity = opacity;
          if (lowerLight) lowerLight.style.opacity = opacity;
        });

        animationFrame = window.requestAnimationFrame(animateRoadmapLights);
      }

      function initializeRoadmapDualTracks() {
        updateRoadmapDualTrackGeometry();
        document.querySelectorAll('.RoadMapSection_roadmap__timeline__wrapper__EVRm5 img').forEach(function (img) {
          if (!img.complete) img.addEventListener('load', updateRoadmapDualTrackGeometry);
        });
        if ('ResizeObserver' in window) {
          document.querySelectorAll('.RoadMapSection_roadmap__timeline__wrapper__EVRm5').forEach(function (w) {
            new ResizeObserver(updateRoadmapDualTrackGeometry).observe(w);
          });
        }
        window.cancelAnimationFrame(animationFrame);
        animationStartedAt = 0;
        animationFrame = window.requestAnimationFrame(animateRoadmapLights);
      }

      window.addEventListener('load', initializeRoadmapDualTracks);
      window.addEventListener('resize', updateRoadmapDualTrackGeometry);
      if (document.readyState === 'interactive' || document.readyState === 'complete') {
        initializeRoadmapDualTracks();
      }
    })();
  </script>
<!-- Roadmap dual-track runtime: end -->
