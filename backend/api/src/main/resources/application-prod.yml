# application-prod.yml
# DİQQƏT: burada HEÇ BİR dəyər üçün default yoxdur (bax "${VAR}" — placeholder-siz) —
# əvvəllər DB_URL/DB_USERNAME/DB_PASSWORD kimi başqa adlar istifadə olunurdu, halbuki
# .env/.env.example və application.yml (default profil) DB_HOST/DB_PORT/DB_NAME/
# DB_USER/DB_PASSWORD adlandırmasını gözləyir — bu uyğunsuzluq sənədləşdirilməmiş
# və qarışdırıcı idi. İndi eyni adlandırma istifadə olunur ki, .env.example-dəki
# siyahı prod üçün də etibarlı olsun.

# Prod-da tətbiq reverse proxy (nginx / k8s ingress / load balancer) arxasında işləyir —
# xarici sxem/host yalnız X-Forwarded-* başlıqlarında gəlir. Bu ayar olmadan Spring
# bağlantını "http://<container-ip>:8081" kimi görür: redirect-lər və generasiya olunan
# mütləq URL-lər http:// olur, `secure` cookie məntiqi isə səhv işləyir.
server:
  forward-headers-strategy: framework

spring:
  datasource:
    # stringtype=unspecified: bax application.yml-dəki eyni qeyd (native ENUM/INET sütunları).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?stringtype=unspecified
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    # V16 (identity.users.full_name-in silinməsi) qəsdən bloklanıb.
    #
    # V15 geriyə uyğundur — icra olunandan sonra köhnə və yeni podlar eyni anda işləyə
    # bilir (bax V15-dəki sinxronizasiya trigger-i), ona görə RollingUpdate downtime-sız
    # keçir. V16 isə full_name-i DROP edir: hələ işləyən köhnə pod həmin an çökər.
    #
    # AKTİVLƏŞDİRMƏ ARDICILLIĞI (V15-li reliz tam yayıldıqdan sonra):
    #   1. `kubectl rollout status deploy/nexora-app` ilə köhnə podların söndüyünü təsdiqlə
    #   2. Bazanın backup-ını al (V16 geri qaytarıla bilməz)
    #   3. Bu sətri 16-ya dəyiş və ya `target` açarını tamamilə sil
    #   4. Yenidən deploy et
    #
    # QEYD: dev/test profillərində bu məhdudiyyət yoxdur — orada rolling deploy olmadığı
    # üçün V16 dərhal işləyir və sxem son formasına düşür.
    target: "15"

# Prod-da default/insecure JWT sirri ilə işə düşməsin deyə placeholder-siz —
# JWT_SECRET təyin olunmayıbsa tətbiq başlamayacaq (əvəzinə sussuzca dev
# default-u ilə işə düşüb istehsalatda saxta token qəbul etməkdənsə).
app:
  jwt:
    secret: ${JWT_SECRET}

  # Eyni səbəbdən burada da default yoxdur — dev-dəki localhost:3000 fallback-ı
  # (bax application.yml) prod-da səssizcə aktiv qalıb hər origin-i rədd etməsin
  # deyə, CORS_ALLOWED_ORIGINS təyin olunmayıbsa tətbiq başlamayacaq.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  # application.yml-dəki dev default-ları ("admin1234" və s.) prod-a sızmasın deyə:
  # seed burada sönülüdür və şifrə default-ları boşdur. Prod-da admin hesabı seed
  # etmək lazım gələrsə ADMIN_SEED_ENABLED=true + ADMIN_SEED_*_PASSWORD env
  # dəyərləri verilməlidir — şifrə boş qalarsa AdminSeeder açılışda xəta atır.
  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:false}
    system-admin-password: ${ADMIN_SEED_SYSTEM_ADMIN_PASSWORD:}
    admin-password: ${ADMIN_SEED_ADMIN_PASSWORD:}
    sales-crm-password: ${ADMIN_SEED_SALES_CRM_PASSWORD:}
    content-manager-password: ${ADMIN_SEED_CONTENT_MANAGER_PASSWORD:}

# Endpoint sxemini/DTO strukturunu ictimaiyyətə açmamaq üçün prod-da söndürülür —
# SecurityConfig-də /swagger-ui/** və /v3/api-docs/** permitAll-dır, ona görə
# yeganə etibarlı bağlama nöqtəsi springdoc-un özünü söndürməkdir.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# k8s (və ya digər orkestrator) tərəfindən ayrıca liveness/readiness probe
# istifadə edilə bilməsi üçün — /actuator/health/liveness və
# /actuator/health/readiness alt-statuslarını aktivləşdirir. Əsas
# /actuator/health (permitAll, bax SecurityConfig) təsirlənmir.
management:
  # Actuator ayrıca porta köçürülür ki, ictimai ingress (yalnız 8081-i backend
  # kimi göstərir) heç bir actuator endpoint-inə çata bilməsin. 9091 nə Service-də,
  # nə ingress-də xaricə verilir — yalnız klaster daxilindən (kubelet probe-ları,
  # Prometheus scrape) əlçatandır, bax k8s/04-app-service.yaml və 06-network-policy.yaml.
  # DİQQƏT: ayrıca management portu öz (child) kontekstində işləyir — SecurityConfig-dəki
  # filter zənciri ORA TƏTBİQ OLUNMUR. Yəni bu portu heç vaxt LoadBalancer/NodePort
  # ilə xaricə çıxarmayın.
  server:
    port: 9091

  endpoints:
    web:
      exposure:
        # Yalnız bunlar. "*" YAZMAYIN — /actuator/env, /actuator/configprops və
        # /actuator/heapdump bütün env dəyişənlərini (JWT_SECRET, DB_PASSWORD daxil)
        # və ya heap-in tam surətini verir.
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      # Sağlamlıq detalları (DB adı, disk yolu) yalnız daxili portdadır, yenə də
      # minimuma endirilir — xarici müştəriyə "UP/DOWN"-dan artığı lazım deyil.
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      # Prometheus-da bütün metrikalara mühit etiketi əlavə olunur ki, staging və
      # prod eyni Prometheus-a yazanda qarışmasın.
      application: nexora-academy
      environment: prod

logging:
  level:
    root: WARN
