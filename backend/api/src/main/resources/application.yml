server:
  port: 8081

logging:
  pattern:
    level: "%5p [%X{correlationId:--}]"

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexora_academy}?stringtype=unspecified
    username: ${DB_USER:nexora_app}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
        format_sql: true
        jdbc:
          batch_size: 25
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 26MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: identity,catalog,crm,cms,platform
    default-schema: identity
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me!!}
    issuer: ${JWT_ISSUER:nexora-academy}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_SEED_EMAIL:admin@nexora.com}
    password: ${ADMIN_SEED_PASSWORD:admin1234}

  log-dir: ${LOG_DIR:logs}

  upload:
    dir: ${UPLOADS_DIR:./uploads}
