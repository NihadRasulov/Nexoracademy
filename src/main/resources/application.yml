server:
  port: 8081

# Console log-larına da correlation-id əlavə edir (bax logging/CorrelationIdFilter,
# logback-spring.xml/FILE_LOG_PATTERN) — Spring Boot-un default CONSOLE_LOG_PATTERN-i
# bu "level" bloğunu istifadə edir, ona görə tam pattern-i təkrar yazmaq lazım deyil.
logging:
  pattern:
    level: "%5p [%X{correlationId:--}]"

# application.yml — Spring Boot + PostgreSQL + Flyway konfiqurasiyası
# Dəyərlər .env faylından (spring-dotenv vasitəsilə) və ya real ETX env
# dəyişənlərindən oxunur — bax .env.example. .env heç vaxt commit edilməməlidir.

spring:
  datasource:
    # stringtype=unspecified: Postgres native ENUM/INET sütunlarına String
    # parametr bind edərkən JDBC-nin onları VARCHAR kimi göndərməsinin qarşısını alır
    # (əks halda "column is of type X but expression is of type character varying" xətası olur).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexora_academy}?stringtype=unspecified
    username: ${DB_USER:nexora_app}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      # Bir bağlantı bu müddətdən çox "checked out" qalıb geri qaytarılmasa
      # (kodda bağlanmamış Connection/Statement) log-a xəbərdarlıq yazılır —
      # sızma yalnız sükutla connection pool-u tükətmək əvəzinə erkən aşkarlanır.
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      # DİQQƏT: schema idarəçiliyi tam Flyway-ə həvalə olunur.
      # Hibernate heç vaxt schema yaratmamalı/dəyişməməlidir.
      ddl-auto: validate
    properties:
      hibernate:
        # Yalnız default (@Table schema göstərilməyən entity-lər üçün) sxem.
        # Digər modullardakı entity-lərdə @Table(schema = "catalog") və s. göstərilməlidir.
        default_schema: identity
        format_sql: true
        jdbc:
          batch_size: 25
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: identity,catalog,academics,billing,outcomes,crm,cms,ai,notify,platform,analytics
    default-schema: identity
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    # server-tərəfli CREATE EXTENSION icazəsi olan rol tələb olunur:
    # bax V1__init_extensions_and_schemas.sql (pgcrypto, citext, vector)

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
        # EmailService bağlantı xətasını udur və log yazır — MAIL_HOST konfiqurasiya
        # olunmayıbsa belə app işə düşür (bax service/notify/EmailService.java).
        # 10 saniyə: əvvəlki 3000 ms MailHog (lokal, ani cavab) üçün seçilmişdi və real
        # SMTP-də (Gmail STARTTLS handshake) tez-tez timeout-a düşüb məktubu səssizcə
        # itirirdi. Göndərmə artıq @Async olduğu üçün bu gözləmə sorğunu bloklamır.
        connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
        timeout: ${MAIL_READ_TIMEOUT_MS:10000}
        writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

# Mail göndərilməsi qəsdən "best-effort"dur (bax EmailService) — SMTP
# konfiqurasiya olunmayanda /actuator/health-i "DOWN" göstərməsin.
management:
  health:
    mail:
      enabled: false

app:
  cors:
    # Vergüllə ayrılmış origin siyahısı (List<String>-ə avtomatik çevrilir).
    # Prod-da default YOXDUR (bax application-prod.yml) — CORS_ALLOWED_ORIGINS
    # təyin olunmayıbsa tətbiq açılmayacaq.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  jwt:
    # JWT_SECRET .env-də təyin olunmalıdır (Base64, min. 256 bit / 32 byte).
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me!!}
    issuer: ${JWT_ISSUER:nexora-academy}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}       # 15 dəqiqə
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 gün

  mail:
    from: ${MAIL_FROM:no-reply@nexora-academy.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  # Admin-panel default hesabları (bax config/AdminSeeder, AdminSeederProperties).
  # Aşağıdakı default-lar YALNIZ dev/lokal üçündür — prod profilində seed sönülüdür
  # və şifrə default-ları boşdur (bax application-prod.yml).
  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:true}
    system-admin-password: ${ADMIN_SEED_SYSTEM_ADMIN_PASSWORD:system-admin1234}
    admin-password: ${ADMIN_SEED_ADMIN_PASSWORD:admin1234}
    sales-crm-password: ${ADMIN_SEED_SALES_CRM_PASSWORD:sales-crm1234}
    content-manager-password: ${ADMIN_SEED_CONTENT_MANAGER_PASSWORD:content-manager1234}

  auth:
    password-reset-expiration-ms: ${PASSWORD_RESET_EXPIRATION_MS:3600000}     # 1 saat
    # Qeydiyyat email-təsdiqi OTP-si (6 rəqəmli kod) — link deyil, ona görə ömrü qısadır.
    email-verify-expiration-ms: ${EMAIL_VERIFY_EXPIRATION_MS:600000}          # 10 dəqiqə
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}

  # CRUD/error logları harada saxlanılsın (bax logback-spring.xml).
  # create/read/update/delete/error üçün ayrı alt-qovluqlar, 30 gün saxlama.
  log-dir: ${LOG_DIR:logs}

  payment:
    gateway:
      # Real gateway seçilməyənə qədər boş qalır — PaymentGatewaySignatureVerifier
      # bu halda imza yoxlanışını bypass edir (WARN logu ilə). Dəyər təyin
      # olunan kimi /api/v1/payments/callback üçün imza məcburi olur.
      webhook-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:}
      # Gateway-in imzanı hansı HTTP başlığında göndərdiyi — provayderə görə dəyişə bilər.
      signature-header: ${PAYMENT_GATEWAY_SIGNATURE_HEADER:X-Gateway-Signature}

  # Qrup yoldaşının öz yazdığı (self-hosted) chat-bota qoşulma — bax
  # config/ChatbotProperties, service/ai/ChatbotService. Yalnız aşağıdakı env
  # dəyərlərini doldurmaq kifayətdir (bax CHATBOT_INTEQRASIYASI.md).
  # CHATBOT_ENABLED=false olduqda tətbiq problemsiz işə düşür, bot çağırılmır.
  chatbot:
    enabled: ${CHATBOT_ENABLED:false}
    base-url: ${CHATBOT_BASE_URL:}
    chat-path: ${CHATBOT_CHAT_PATH:/chat}
    api-key: ${CHATBOT_API_KEY:}
    api-key-header: ${CHATBOT_API_KEY_HEADER:X-API-Key}
    connect-timeout-ms: ${CHATBOT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CHATBOT_READ_TIMEOUT_MS:20000}